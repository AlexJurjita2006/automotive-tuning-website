<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-label="AJ Tuning Performance Garage Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>

    <linearGradient id="iconShellGrad" x1="180" y1="230" x2="420" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17253A"/>
      <stop offset="0.55" stop-color="#0E1A2B"/>
      <stop offset="1" stop-color="#070B12"/>
    </linearGradient>

    <linearGradient id="metalMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="0.35" stop-color="#C8D2DE"/>
      <stop offset="0.55" stop-color="#FDFEFF"/>
      <stop offset="1" stop-color="#9CA8B8"/>
    </linearGradient>

    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7B3C2"/>
      <stop offset="0.5" stop-color="#7E8C9E"/>
      <stop offset="1" stop-color="#CED7E2"/>
    </linearGradient>

    <linearGradient id="brandMetal" x1="620" y1="295" x2="740" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.32" stop-color="#CDD4DF"/>
      <stop offset="0.58" stop-color="#EEF2F8"/>
      <stop offset="1" stop-color="#9EA8B5"/>
    </linearGradient>

    <linearGradient id="tuningRed" x1="745" y1="295" x2="1040" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6671"/>
      <stop offset="0.55" stop-color="#FF2F42"/>
      <stop offset="1" stop-color="#D50E28"/>
    </linearGradient>

    <linearGradient id="lineRed" x1="640" y1="525" x2="1340" y2="525" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3345"/>
      <stop offset="0.42" stop-color="#FF3143"/>
      <stop offset="1" stop-color="#FF3143" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="iconGlow" x="120" y="170" width="360" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0E1827" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#1F4C80" flood-opacity="0.25"/>
    </filter>

    <filter id="redGlow" x="700" y="250" width="400" height="190" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF3044" flood-opacity="0.45"/>
    </filter>

    <filter id="lineGlow" x="620" y="500" width="760" height="50" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FF3345" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <g filter="url(#iconGlow)">
    <rect x="160" y="210" width="270" height="270" rx="56" fill="url(#iconShellGrad)"/>
    <rect x="160.75" y="210.75" width="268.5" height="268.5" rx="55.25" stroke="#2D4868" stroke-opacity="0.65" stroke-width="1.5"/>
    <path d="M178 284C222 242 286 220 348 230" stroke="#DCE8F8" stroke-opacity="0.17" stroke-width="8" stroke-linecap="round"/>

    <!-- Connecting rod -->
    <g transform="translate(228 238) rotate(-24 68 106)">
      <ellipse cx="33" cy="174" rx="25" ry="25" fill="url(#metalDark)"/>
      <ellipse cx="33" cy="174" rx="14" ry="14" fill="#0E1621"/>

      <rect x="25" y="56" width="16" height="120" rx="8" fill="url(#metalMain)"/>
      <rect x="27" y="56" width="4" height="120" rx="2" fill="#F9FCFF" fill-opacity="0.6"/>
      <rect x="34" y="56" width="4" height="120" rx="2" fill="#7E8B9B" fill-opacity="0.55"/>

      <ellipse cx="33" cy="42" rx="31" ry="31" fill="url(#metalMain)"/>
      <ellipse cx="33" cy="42" rx="17" ry="17" fill="#0C131D"/>
      <ellipse cx="33" cy="42" rx="9" ry="9" fill="#4D5868"/>

      <path d="M12 72L54 58" stroke="#EAF3FF" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M13 138L53 124" stroke="#CFD9E6" stroke-opacity="0.45" stroke-width="2"/>
    </g>

    <!-- Piston crown and skirt -->
    <g transform="translate(294 236) rotate(19 64 86)">
      <ellipse cx="70" cy="45" rx="54" ry="18" fill="#DFE6EF"/>
      <ellipse cx="70" cy="45" rx="52" ry="16" fill="url(#metalMain)"/>
      <rect x="18" y="45" width="104" height="88" rx="22" fill="url(#metalDark)"/>
      <rect x="22" y="52" width="8" height="72" rx="4" fill="#EEF4FC" fill-opacity="0.65"/>
      <rect x="34" y="52" width="4" height="72" rx="2" fill="#5D6878" fill-opacity="0.6"/>

      <path d="M23 62H117" stroke="#D9E2EE" stroke-opacity="0.55" stroke-width="3"/>
      <path d="M23 76H117" stroke="#D9E2EE" stroke-opacity="0.55" stroke-width="3"/>
      <path d="M23 90H117" stroke="#D9E2EE" stroke-opacity="0.52" stroke-width="3"/>

      <!-- Fine etched markings -->
      <text x="52" y="112" fill="#D8E0EA" fill-opacity="0.36" font-size="6" font-family="Arial, Helvetica, sans-serif" transform="rotate(-2 52 112)">AJ-FORGED</text>
      <text x="54" y="120" fill="#D8E0EA" fill-opacity="0.33" font-size="5.2" font-family="Arial, Helvetica, sans-serif">S1-ALLOY</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <text x="570" y="368" fill="url(#brandMetal)" font-family="Oxanium, Rajdhani, Arial, sans-serif" font-size="126" font-weight="800" letter-spacing="-1.5">AJ</text>
    <g filter="url(#redGlow)">
      <text x="742" y="368" fill="url(#tuningRed)" font-family="Oxanium, Rajdhani, Arial, sans-serif" font-size="126" font-weight="900" letter-spacing="-1.5">TUNING</text>
    </g>
    <text x="573" y="440" fill="#AAB3BF" font-family="Rajdhani, Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="8.5">PERFORMANCE GARAGE</text>
  </g>

  <g filter="url(#lineGlow)">
    <circle cx="590" cy="525" r="6" fill="#FF3345"/>
    <path d="M606 525H1336" stroke="url(#lineRed)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
